name: Set up private Paynow test configuration

on:
  push:
    paths:
      - .github/workflows/setup-paynow-private-config.yml

permissions:
  contents: read

jobs:
  setup-private-config:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
    steps:
      - name: Utwórz neutralną prywatną konfigurację poza webrootem
        shell: python
        run: |
          import ftplib, io, os
          host = os.environ['FTP_SERVER'].removeprefix('ftps://').removeprefix('ftp://').rstrip('/')
          remote_dir = os.environ['FTP_REMOTE_DIR'].rstrip('/') or '/'
          ftp = ftplib.FTP_TLS(host, timeout=30)
          ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          ftp.cwd(remote_dir)
          ftp.cwd('..')
          entries = {item.rsplit('/', 1)[-1] for item in ftp.nlst()}
          if 'public_html' not in entries:
              raise RuntimeError('Konto FTPS nie potwierdziło katalogu nadrzędnego public_html; nie utworzono pliku.')
          try:
              ftp.mkd('.hgo-private')
          except ftplib.error_perm:
              pass
          try:
              ftp.sendcmd('SITE CHMOD 700 .hgo-private')
          except ftplib.all_errors:
              pass
          ftp.cwd('.hgo-private')
          body = b"<?php\n\nreturn [\n    'HGO_PAYNOW_TEST_MARKER' => 'TEST_VALUE',\n    'HGO_PAYNOW_ENABLED' => 'false',\n    'HGO_PAYNOW_ENV' => 'sandbox',\n];\n"
          ftp.storbinary('STOR paynow.php', io.BytesIO(body))
          try:
              ftp.sendcmd('SITE CHMOD 600 paynow.php')
          except ftplib.all_errors:
              pass
          ftp.quit()
