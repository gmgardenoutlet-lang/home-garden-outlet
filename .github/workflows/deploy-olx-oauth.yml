name: Deploy OLX OAuth code only
on:
  workflow_dispatch:
    inputs:
      backup_name:
        description: 'Optional completed full OLX backup; products must match, current PHP is backed up separately'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: getspace-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
      OLX_REUSE_BACKUP: ${{ inputs.backup_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, sodium
      - name: Test OAuth without real OLX requests
        run: |
          find hosting/getspace/admin/olx -name '*.php' -exec php -l {} \;
          php tests/olx-oauth-tests.php
          node tests/olx-http-tests.mjs
      - name: Install FTPS client
        run: sudo apt-get update -qq && sudo apt-get install -y lftp
      - name: Back up production and deploy only OLX PHP
        run: node scripts/deploy-olx-oauth.mjs
