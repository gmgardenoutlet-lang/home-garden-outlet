name: Diagnose PHP checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Przygotuj PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: PHP lint — wszystkie pliki
        id: lint
        continue-on-error: true
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            output="$(php -l "$file" 2>&1)"; status=$?
            printf '%s\n' "$output"
            if [ "$status" -ne 0 ]; then
              printf 'FAIL: %s\n' "$file"
              failed=1
            fi
          done < <(find hosting/getspace -name "*.php" -print0)
          if [ "$failed" -eq 0 ]; then echo "PHP LINT OK"; fi
          exit "$failed"

      - name: Test shop frontend — disabled
        id: shop_frontend_disabled
        continue-on-error: true
        run: HGO_SHOP_SALES_ENABLED=false HGO_PAYNOW_ENABLED=false php tests/shop-frontend-tests.php disabled
      - name: Test shop order
        id: shop_order
        continue-on-error: true
        run: HGO_STORAGE_DIR="$(mktemp -d)" HGO_SHOP_SALES_ENABLED=true php tests/shop-order-tests.php
      - name: Test shop frontend — enabled
        id: shop_frontend_enabled
        continue-on-error: true
        run: HGO_SHOP_SALES_ENABLED=true HGO_PAYNOW_ENABLED=false php tests/shop-frontend-tests.php enabled
      - name: Test Paynow v3
        id: paynow
        continue-on-error: true
        run: HGO_SHOP_SALES_ENABLED=true php tests/paynow-v3-tests.php
      - name: Test Codex draft
        id: codex_draft
        continue-on-error: true
        run: php tests/codex-draft-tests.php
      - name: Test admin figure entry
        id: admin_figure
        continue-on-error: true
        run: php tests/admin-figure-entry-tests.php
      - name: Test location stats
        id: location_stats
        continue-on-error: true
        run: php tests/location-stats-tests.php
      - name: Test browser exclusion
        id: browser_exclusion
        continue-on-error: true
        run: php tests/stats-browser-exclusion-http-tests.php
      - name: Test traffic chart stats
        id: traffic_chart
        continue-on-error: true
        run: php tests/traffic-chart-stats-tests.php
      - name: Test diagnostic event log
        id: diagnostic_events
        continue-on-error: true
        run: HGO_STORAGE_DIR="$(mktemp -d)" php tests/diagnostic-events-tests.php
      - name: Test extension ZIP
        id: zip_extension
        continue-on-error: true
        run: php -m | grep -qi '^zip$'

      - name: Podsumowanie diagnostyki
        if: always()
        env:
          LINT: ${{ steps.lint.outcome }}
          SHOP_FRONTEND_DISABLED: ${{ steps.shop_frontend_disabled.outcome }}
          SHOP_ORDER: ${{ steps.shop_order.outcome }}
          SHOP_FRONTEND_ENABLED: ${{ steps.shop_frontend_enabled.outcome }}
          PAYNOW: ${{ steps.paynow.outcome }}
          CODEX_DRAFT: ${{ steps.codex_draft.outcome }}
          ADMIN_FIGURE: ${{ steps.admin_figure.outcome }}
          LOCATION_STATS: ${{ steps.location_stats.outcome }}
          BROWSER_EXCLUSION: ${{ steps.browser_exclusion.outcome }}
          TRAFFIC_CHART: ${{ steps.traffic_chart.outcome }}
          DIAGNOSTIC_EVENTS: ${{ steps.diagnostic_events.outcome }}
          ZIP_EXTENSION: ${{ steps.zip_extension.outcome }}
        run: |
          failed=0
          for result in "$LINT" "$SHOP_FRONTEND_DISABLED" "$SHOP_ORDER" "$SHOP_FRONTEND_ENABLED" "$PAYNOW" "$CODEX_DRAFT" "$ADMIN_FIGURE" "$LOCATION_STATS" "$BROWSER_EXCLUSION" "$TRAFFIC_CHART" "$DIAGNOSTIC_EVENTS" "$ZIP_EXTENSION"; do
            [ "$result" = "success" ] || failed=1
          done
          exit "$failed"
