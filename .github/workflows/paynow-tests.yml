name: Paynow PHP 8.3 tests

on:
  push:
    branches:
      - paynow-payment-flow-test

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Przygotuj PHP i Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Pokaż wersję PHP
        run: php -v

      - name: Zainstaluj zależności PHP do testów
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Sprawdź składnię i testy sklepu oraz Paynow
        run: |
          find hosting/getspace -name "*.php" -print0 | xargs -0 -n1 php -l
          HGO_SHOP_SALES_ENABLED=false HGO_PAYNOW_ENABLED=false php tests/shop-frontend-tests.php disabled
          HGO_STORAGE_DIR="$(mktemp -d)" HGO_SHOP_SALES_ENABLED=true php tests/shop-order-tests.php
          HGO_SHOP_SALES_ENABLED=true HGO_PAYNOW_ENABLED=false php tests/shop-frontend-tests.php enabled
          HGO_SHOP_SALES_ENABLED=true php tests/paynow-v3-tests.php
          php tests/codex-draft-tests.php
          php tests/admin-figure-entry-tests.php
          php tests/location-stats-tests.php
          php tests/stats-browser-exclusion-http-tests.php
          php tests/traffic-chart-stats-tests.php
          HGO_STORAGE_DIR="$(mktemp -d)" php tests/diagnostic-events-tests.php
          php -m | grep -qi '^zip$'
